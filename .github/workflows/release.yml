name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish VibeDoze.exe
        shell: pwsh
        run: |
          $version = '1.0.0'
          if ('${{ github.ref_type }}' -eq 'tag') { $version = '${{ github.ref_name }}'.TrimStart('v') }
          dotnet publish src/VibeDoze/VibeDoze.csproj -c Release -o dist -p:Version=$version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash dist/VibeDoze.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  VibeDoze.exe" | Set-Content -NoNewline dist/VibeDoze.exe.sha256
          "{0:N1} MB  sha256 {1}" -f ((Get-Item dist/VibeDoze.exe).Length / 1MB), $hash

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "VibeDoze $tag" --notes-file .github/release-notes.md
          }
          gh release upload $tag dist/VibeDoze.exe dist/VibeDoze.exe.sha256 --clobber
